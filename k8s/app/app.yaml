apiVersion: v1
kind: Namespace
metadata: {name: app}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmd-parser
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels: {app: cmd-parser}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1            # start 1 new Pod first ...
      maxUnavailable: 0      # ... never drop below 2 ready Pods during an update
  template:
    metadata:
      labels: {app: cmd-parser}
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: cmd-parser
          image: cmd-parser:1.0
          imagePullPolicy: IfNotPresent      # imported with k3d, no registry
          ports:
            - {name: http, containerPort: 8000}
          env:
            - {name: MODEL_URI, value: "s3://models/v1/"}
            - {name: MODEL_VERSION, value: "v1"}
            - {name: S3_ENDPOINT, value: "http://seaweedfs.data.svc.cluster.local:8333"}
            - {name: MAX_NEW_TOKENS, value: "48"}
            - {name: FAULT_INJECT, value: "0"}
            - name: POD_NAME                   # X-Served-By = the real Pod name
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          envFrom:
            - secretRef: {name: s3-credentials}
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:                           # keep serving while Traefik stops routing here
              exec: {command: ["sleep", "8"]}
---
apiVersion: v1
kind: Service
metadata:
  name: cmd-parser
  namespace: app
spec:
  selector: {app: cmd-parser}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cmd-parser
  namespace: app
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /parse
            pathType: Prefix
            backend:
              service: {name: cmd-parser, port: {number: 80}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cmd-parser
  namespace: app
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: cmd-parser}
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}   # 70% of the 500m request
  behavior:
    scaleDown: {stabilizationWindowSeconds: 60}             # default 300 s; faster demo
